<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="title">
<title id="title">100 Days of SwiftUI</title>
<defs>
<radialGradient id="g0"><stop offset="0" stop-color="#FF8A3D" stop-opacity=".95"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".4"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></radialGradient><radialGradient id="g1"><stop offset="0" stop-color="#FF3B6B" stop-opacity=".95"/><stop offset=".5" stop-color="#FF3B6B" stop-opacity=".4"/><stop offset="1" stop-color="#FF3B6B" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#B45CF2" stop-opacity=".95"/><stop offset=".5" stop-color="#B45CF2" stop-opacity=".4"/><stop offset="1" stop-color="#B45CF2" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#2F7BFF" stop-opacity=".95"/><stop offset=".5" stop-color="#2F7BFF" stop-opacity=".4"/><stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/></radialGradient><radialGradient id="g4"><stop offset="0" stop-color="#FFB547" stop-opacity=".95"/><stop offset=".5" stop-color="#FFB547" stop-opacity=".4"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B1442"/><stop offset=".5" stop-color="#29155A"/><stop offset="1" stop-color="#0E2A6E"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".24"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/><stop offset=".4" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset=".75" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".45"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".2"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect x="0" y="0" width="800" height="340" rx="28"/></clipPath>
<clipPath id="pane"><rect x="48.98" y="95" width="702.03" height="150" rx="40.5"/></clipPath>
<filter id="shadow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<style>
@keyframes m0 { 0% { transform: translate(0px, 0px); } 25% { transform: translate(90px, 70px); } 50% { transform: translate(-40px, 110px); } 75% { transform: translate(60px, -20px); } 100% { transform: translate(0, 0); } } .b0 { animation: m0 19s ease-in-out infinite; }
@keyframes m1 { 0% { transform: translate(0px, 0px); } 25% { transform: translate(130px, -70px); } 50% { transform: translate(-90px, -40px); } 75% { transform: translate(40px, 30px); } 100% { transform: translate(0, 0); } } .b1 { animation: m1 23s ease-in-out infinite; }
@keyframes m2 { 0% { transform: translate(0px, 0px); } 25% { transform: translate(-90px, 110px); } 50% { transform: translate(110px, 60px); } 75% { transform: translate(-30px, -20px); } 100% { transform: translate(0, 0); } } .b2 { animation: m2 21s ease-in-out infinite; }
@keyframes m3 { 0% { transform: translate(0px, 0px); } 25% { transform: translate(-120px, -40px); } 50% { transform: translate(40px, -90px); } 75% { transform: translate(-60px, 10px); } 100% { transform: translate(0, 0); } } .b3 { animation: m3 26s ease-in-out infinite; }
@keyframes m4 { 0% { transform: translate(0px, 0px); } 25% { transform: translate(100px, -60px); } 50% { transform: translate(-10px, -80px); } 75% { transform: translate(60px, 20px); } 100% { transform: translate(0, 0); } } .b4 { animation: m4 17s ease-in-out infinite; }
.pane { transform-origin: 400px 170px; animation: pop 1s cubic-bezier(.2, .8, .2, 1) .15s both; }
.sheen { animation: sweep 8s ease-in-out 1.4s infinite both; }
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
@keyframes sweep { from { transform: translateX(0); } 30%, to { transform: translateX(1222.03px); } }
@media (prefers-reduced-motion: reduce) { .b, .pane, .sheen { animation: none; } }
</style>
